<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 차계부</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-28">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">
        <i class="fa-solid fa-car"></i>
      </div>
      <h1 class="text-base font-bold tracking-tight text-white">마이카 로그</h1>
    </div>
    <div class="flex items-center space-x-2">
      <button type="button" onclick="fetchData()" id="refreshBtn" class="p-2 text-slate-400 hover:text-white transition">
        <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i>
      </button>
      <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700 flex items-center space-x-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
        <span>시트 연동</span>
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- 대시보드 요약 카드 -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
        <div class="text-xs text-slate-400 flex items-center justify-between">
          <span>당월 지출</span>
          <i class="fa-solid fa-won-sign text-emerald-400"></i>
        </div>
        <div class="mt-2">
          <span id="monthlyTotal" class="text-xl font-bold tracking-tight text-white">0</span>
          <span class="text-xs text-slate-400 ml-0.5">원</span>
        </div>
      </div>

      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
        <div class="text-xs text-slate-400 flex items-center justify-between">
          <span>최근 주행거리</span>
          <i class="fa-solid fa-gauge-high text-blue-400"></i>
        </div>
        <div class="mt-2">
          <span id="latestOdo" class="text-xl font-bold tracking-tight text-white">0</span>
          <span class="text-xs text-slate-400 ml-0.5">km</span>
        </div>
      </div>

      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
        <div class="text-xs text-slate-400 flex items-center justify-between">
          <span>평균 연비</span>
          <i class="fa-solid fa-gas-pump text-amber-400"></i>
        </div>
        <div class="mt-2">
          <span id="avgFuelEfficiency" class="text-xl font-bold tracking-tight text-white">--</span>
          <span class="text-xs text-slate-400 ml-0.5">km/L</span>
        </div>
      </div>

      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
        <div class="text-xs text-slate-400 flex items-center justify-between">
          <span>누적 총 지출</span>
          <i class="fa-solid fa-receipt text-purple-400"></i>
        </div>
        <div class="mt-2">
          <span id="totalCost" class="text-xl font-bold tracking-tight text-white">0</span>
          <span class="text-xs text-slate-400 ml-0.5">원</span>
        </div>
      </div>
    </div>

    <!-- 카테고리 필터 -->
    <div class="flex items-center space-x-1.5 overflow-x-auto no-scrollbar py-1">
      <button type="button" onclick="setFilter('전체')" class="filter-btn active px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-500 text-white whitespace-nowrap transition">전체</button>
      <button type="button" onclick="setFilter('주유')" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition">⛽ 주유</button>
      <button type="button" onclick="setFilter('정비')" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition">🔧 정비</button>
      <button type="button" onclick="setFilter('세차')" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition">🚗 세차</button>
      <button type="button" onclick="setFilter('주차')" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition">🅿️ 주차</button>
      <button type="button" onclick="setFilter('통행료')" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition">🛣️ 통행료</button>
      <button type="button" onclick="setFilter('보험/세금')" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition">📄 보험/세금</button>
      <button type="button" onclick="setFilter('기타')" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition">📦 기타</button>
    </div>

    <!-- 지출 내역 영역 -->
    <div class="space-y-2.5">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase">지출 내역</h2>
        <span id="recordCount" class="text-xs text-slate-500">0건</span>
      </div>

      <!-- 리스트 컨테이너 -->
      <div id="recordList" class="space-y-2.5 min-h-[140px] flex flex-col justify-center">
        <div id="loadingIndicator" class="text-center py-8 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-400"></i>
          <p class="text-xs mt-2">구글 시트 데이터 확인 중...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 추가 버튼 (최상단 z-index 고정) -->
  <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto px-4 z-40">
    <button type="button" id="openModalBtn" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 flex items-center justify-center space-x-2 transition cursor-pointer">
      <i class="fa-solid fa-plus text-base pointer-events-none"></i>
      <span class="pointer-events-none text-sm">새로운 기록 추가</span>
    </button>
  </div>

  <!-- 입력 모달 창 -->
  <div id="inputModal" style="display: none;" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[92vh] overflow-y-auto no-scrollbar shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800">
        <h3 class="text-base font-bold text-white">차량 지출 등록</h3>
        <button type="button" id="closeModalBtn" class="text-slate-400 hover:text-white p-2">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form id="recordForm" class="mt-4 space-y-4">
        <!-- 1. 카테고리 선택 -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-2">구분 선택</label>
          <div class="grid grid-cols-4 gap-2">
            <button type="button" data-cat="주유" class="cat-chip active py-2 px-1 text-xs font-semibold rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">⛽ 주유</button>
            <button type="button" data-cat="정비" class="cat-chip py-2 px-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700">🔧 정비</button>
            <button type="button" data-cat="세차" class="cat-chip py-2 px-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700">🚗 세차</button>
            <button type="button" data-cat="주차" class="cat-chip py-2 px-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700">🅿️ 주차</button>
            <button type="button" data-cat="통행료" class="cat-chip py-2 px-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700">🛣️ 통행료</button>
            <button type="button" data-cat="보험/세금" class="cat-chip py-2 px-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700">📄 보험/세금</button>
            <button type="button" data-cat="기타" class="cat-chip py-2 px-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700 col-span-2">📦 기타</button>
          </div>
          <input type="hidden" id="formType" value="주유">
        </div>

        <!-- 2. 날짜 및 내용 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">날짜</label>
            <input type="date" id="formDate" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">내용 / 장소</label>
            <input type="text" id="formTitle" placeholder="예: 주유소, 주차장" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <!-- 3. 결제 금액 및 주행거리 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">결제 금액 (원)</label>
            <input type="number" id="formCost" placeholder="0" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">계기판 주행거리 (km)</label>
            <input type="number" id="formOdo" placeholder="예: 145000" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <!-- 4. 주유 전용 영역 -->
        <div id="fuelSection" class="p-3 bg-slate-800/50 border border-slate-800 rounded-xl space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">주유량 (L)</label>
              <input type="number" step="0.01" id="formLiters" placeholder="예: 35.2" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">단가 (원/L)</label>
              <input type="number" id="formUnitPrice" placeholder="자동계산" class="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl px-3 py-2.5 text-xs text-emerald-400 font-semibold placeholder-slate-500 focus:outline-none">
            </div>
          </div>
        </div>

        <!-- 5. 메모 -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">메모 (선택)</label>
          <input type="text" id="formNote" placeholder="추가 메모" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-bold rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
          <span>구글 시트에 저장하기</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzgYEqusdd1Wan5lDAojR_cF-7Si8QqpkOL--CqfwYfI15Cxwwm0moZx4Gad8G0ZQaBkw/exec";

    let records = [];
    let currentFilter = '전체';

    // DOM 요소 캐싱
    const modal = document.getElementById("inputModal");
    const openBtn = document.getElementById("openModalBtn");
    const closeBtn = document.getElementById("closeModalBtn");
    const formCost = document.getElementById("formCost");
    const formLiters = document.getElementById("formLiters");
    const formUnitPrice = document.getElementById("formUnitPrice");

    // 모달 제어 이벤트 바인딩 (인라인 클릭 이슈 방지)
    openBtn.addEventListener("click", () => {
      modal.style.display = "flex";
    });

    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    // 단가 자동계산
    function calcUnitPrice() {
      const cost = Number(formCost.value) || 0;
      const liters = Number(formLiters.value) || 0;
      if (cost > 0 && liters > 0) {
        formUnitPrice.value = Math.round(cost / liters);
      }
    }
    formCost.addEventListener("input", calcUnitPrice);
    formLiters.addEventListener("input", calcUnitPrice);

    // 카테고리 칩 선택 이벤트 바인딩
    document.querySelectorAll(".cat-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const cat = btn.getAttribute("data-cat");
        document.getElementById("formType").value = cat;

        document.querySelectorAll(".cat-chip").forEach(b => {
          b.className = "cat-chip py-2 px-1 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700";
        });
        btn.className = "cat-chip active py-2 px-1 text-xs font-semibold rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";

        const fuelSection = document.getElementById("fuelSection");
        if (cat === "주유") {
          fuelSection.style.display = "block";
        } else {
          fuelSection.style.display = "none";
        }
      });
    });

    // 1. 구글 시트 데이터 로드 (최대 3초 타임아웃 방어)
    async function fetchData() {
      const refreshIcon = document.getElementById("refreshIcon");
      const listContainer = document.getElementById("recordList");
      refreshIcon.classList.add("fa-spin");

      listContainer.innerHTML = `
        <div id="loadingIndicator" class="text-center py-8 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-400"></i>
          <p class="text-xs mt-2">구글 시트 데이터 확인 중...</p>
        </div>
      `;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3500);

      try {
        const res = await fetch(API_URL, {
          method: "GET",
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const data = await res.json();
        records = Array.isArray(data) ? data : [];
        records.sort((a, b) => new Date(b.date) - new Date(a.date));
      } catch (err) {
        console.warn("데이터 가져오기 지연 또는 빈 상태:", err);
      } finally {
        refreshIcon.classList.remove("fa-spin");
        updateDashboard();
        renderRecords();
      }
    }

    // 2. 대시보드 계산
    function updateDashboard() {
      const now = new Date();
      const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      let monthlyTotal = 0;
      let totalCost = 0;
      let maxOdo = 0;

      records.forEach(r => {
        const cost = Number(r.cost) || 0;
        const odo = Number(r.odo) || 0;
        totalCost += cost;
        if (String(r.date).startsWith(prefix)) monthlyTotal += cost;
        if (odo > maxOdo) maxOdo = odo;
      });

      document.getElementById("monthlyTotal").innerText = monthlyTotal.toLocaleString();
      document.getElementById("totalCost").innerText = totalCost.toLocaleString();
      document.getElementById("latestOdo").innerText = maxOdo > 0 ? maxOdo.toLocaleString() : "0";

      const fuelRecords = records
        .filter(r => r.type === "주유" && Number(r.odo) > 0 && Number(r.liters) > 0)
        .sort((a, b) => Number(a.odo) - Number(b.odo));

      if (fuelRecords.length >= 2) {
        const last = fuelRecords[fuelRecords.length - 1];
        const prev = fuelRecords[fuelRecords.length - 2];
        const dist = last.odo - prev.odo;
        if (dist > 0 && last.liters > 0) {
          document.getElementById("avgFuelEfficiency").innerText = (dist / last.liters).toFixed(1);
          return;
        }
      }
      document.getElementById("avgFuelEfficiency").innerText = "--";
    }

    // 3. 지출 내역 출력
    function renderRecords() {
      const listContainer = document.getElementById("recordList");
      listContainer.innerHTML = "";

      const filtered = currentFilter === '전체' 
        ? records 
        : records.filter(r => r.type === currentFilter);

      document.getElementById("recordCount").innerText = `${filtered.length}건`;

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-500 bg-slate-800/40 rounded-xl border border-slate-800">
            <i class="fa-regular fa-folder-open text-2xl mb-1 text-slate-600 block"></i>
            <p class="text-xs">내역이 없습니다.</p>
            <p class="text-[11px] text-slate-600 mt-0.5">아래 버튼을 눌러 첫 기록을 입력해 보세요.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(r => {
        const item = document.createElement("div");
        item.className = "bg-slate-800/80 border border-slate-700/60 rounded-xl p-3 flex justify-between items-center shadow-sm";

        let iconClass = "fa-receipt text-purple-400";
        if (r.type === "주유") iconClass = "fa-gas-pump text-emerald-400";
        else if (r.type === "정비") iconClass = "fa-wrench text-blue-400";
        else if (r.type === "세차") iconClass = "fa-spray-can text-cyan-400";
        else if (r.type === "주차") iconClass = "fa-square-parking text-amber-400";
        else if (r.type === "통행료") iconClass = "fa-road text-indigo-400";
        else if (r.type === "보험/세금") iconClass = "fa-file-invoice-dollar text-red-400";

        let sub = [];
        if (r.odo) sub.push(`${Number(r.odo).toLocaleString()}km`);
        if (r.type === "주유" && r.liters) sub.push(`${r.liters}L`);
        if (r.type === "주유" && r.unitPrice) sub.push(`@${Number(r.unitPrice).toLocaleString()}원`);
        if (r.note) sub.push(r.note);

        item.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-slate-900 flex items-center justify-center text-sm border border-slate-700/50">
              <i class="fa-solid ${iconClass}"></i>
            </div>
            <div>
              <div class="flex items-center space-x-1.5">
                <span class="text-xs font-bold text-white">${r.title || r.type}</span>
                <span class="text-[10px] bg-slate-700/60 text-slate-300 px-1.5 py-0.2 rounded font-medium">${r.type}</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5">${sub.join(" · ") || r.date}</p>
            </div>
          </div>
          <div class="text-right">
            <span class="text-sm font-bold text-white">${Number(r.cost).toLocaleString()}</span><span class="text-[11px] text-slate-400 ml-0.5">원</span>
            <p class="text-[10px] text-slate-500">${r.date}</p>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    // 4. 필터 변경
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        if (btn.innerText.includes(filter)) {
          btn.className = "filter-btn active px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-500 text-white whitespace-nowrap transition";
        } else {
          btn.className = "filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 border border-slate-700 whitespace-nowrap transition";
        }
      });
      renderRecords();
    }

    // 5. 폼 제출 (저장)
    document.getElementById("recordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>저장 중...</span>`;

      const newRecord = {
        id: Date.now().toString(),
        date: document.getElementById("formDate").value,
        type: document.getElementById("formType").value,
        title: document.getElementById("formTitle").value,
        cost: Number(document.getElementById("formCost").value) || 0,
        odo: Number(document.getElementById("formOdo").value) || 0,
        liters: Number(document.getElementById("formLiters").value) || 0,
        unitPrice: Number(document.getElementById("formUnitPrice").value) || 0,
        note: document.getElementById("formNote").value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(newRecord),
          mode: "no-cors"
        });

        // 입력 폼 리셋 및 모달 닫기
        document.getElementById("formTitle").value = "";
        document.getElementById("formCost").value = "";
        document.getElementById("formOdo").value = "";
        document.getElementById("formLiters").value = "";
        document.getElementById("formUnitPrice").value = "";
        document.getElementById("formNote").value = "";
        modal.style.display = "none";

        // 화면 즉시 임시 반영 후 시트 갱신
        records.unshift(newRecord);
        updateDashboard();
        renderRecords();

        setTimeout(() => fetchData(), 1200);
      } catch (err) {
        alert("저장에 실패했습니다. 잠시 후 다시 시도해 주세요.");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>구글 시트에 저장하기</span>`;
      }
    });

    // 시작 시 기본 날짜 세팅 및 데이터 조회
    document.getElementById("formDate").valueAsDate = new Date();
    fetchData();
  </script>
</body>
</html>
